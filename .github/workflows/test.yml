name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.test
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      - run: npm test
